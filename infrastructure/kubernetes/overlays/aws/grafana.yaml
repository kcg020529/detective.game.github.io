# 감사 대시보드와 Discord 알림용 Grafana. 외부 노출 없이 nginx(/api/v1/admin/grafana/)의 관리자 확인을 거쳐서만 접근한다.
# 비밀값은 kervion-grafana Secret(GRAFANA_ADMIN_PASSWORD, GRAFANA_DB_PASSWORD, KERVION_DISCORD_WEBHOOK_URL)으로 따로 만든다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/part-of: kervion
    app.kubernetes.io/name: grafana
    app.kubernetes.io/tier: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kervion
        app.kubernetes.io/name: grafana
        app.kubernetes.io/tier: app
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: kervion-grafana, key: GRAFANA_ADMIN_PASSWORD}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_AUTH_PROXY_ENABLED, value: "true"}
            - {name: GF_AUTH_PROXY_HEADER_NAME, value: X-WEBAUTH-USER}
            - {name: GF_AUTH_PROXY_AUTO_SIGN_UP, value: "true"}
            - {name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN, value: "false"}
            - {name: GF_USERS_AUTO_ASSIGN_ORG_ROLE, value: Viewer}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
            - {name: GF_SERVER_ROOT_URL, value: "https://__DOMAIN__/api/v1/admin/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GRAFANA_DB_USER, value: grafana_reader}
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: kervion-grafana, key: GRAFANA_DB_PASSWORD}
            - {name: GRAFANA_DB_NAME, value: kervion}
            - name: KERVION_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: kervion-grafana, key: KERVION_DISCORD_WEBHOOK_URL}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # 384Mi에서 대시보드 조회와 알림 평가가 겹치면 OOMKilled(실측 317Mi 사용 중 재시작).
              memory: 1Gi
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        # shortcut: 알림 상태·사용자 설정은 재시작 시 초기화된다. 설정은 모두 파일 프로비저닝이라 다시 만들어진다.
        - {name: data, emptyDir: {}}
        - {name: datasources, configMap: {name: kervion-grafana-datasources}}
        - {name: dashboard-providers, configMap: {name: kervion-grafana-dashboard-providers}}
        - {name: alerting, configMap: {name: kervion-grafana-alerting}}
        - {name: dashboards, configMap: {name: kervion-grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/part-of: kervion
    app.kubernetes.io/name: grafana
    app.kubernetes.io/tier: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000

# nginx.conf의 resolver(127.0.0.11)는 Docker 전용이다. 쿠버네티스에서는 파드의 DNS와 grafana 전체 이름으로 바꿔 띄운다.
- op: replace
  path: /spec/template/spec/containers/0/volumeMounts/0
  value:
    name: nginx-config
    mountPath: /etc/nginx/kervion
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/command
  value:
    - /bin/sh
    - -c
    - >-
      ns=$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf) &&
      sed -e "s/resolver 127.0.0.11/resolver $ns/"
      -e "s#http://grafana:3000#http://grafana.kervion.svc.cluster.local:3000#"
      /etc/nginx/kervion/nginx.conf > /etc/nginx/nginx.conf &&
      exec nginx -g 'daemon off;'

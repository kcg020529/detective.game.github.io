# 실제 계정·주소는 배포 시 공통 렌더러에서 치환한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kervion
resources:
  - ../../base
  - storageclass-gp3.yaml
  - ingress.yaml
  - grafana.yaml
images:
  - name: kervion-backend
    newName: __ECR_REGISTRY__/kervion-backend
    newTag: __IMAGE_TAG__
  - name: kervion-web
    newName: __ECR_REGISTRY__/kervion-web
    newTag: __IMAGE_TAG__
patches:
  - path: configmap-patch.yaml
  - path: web-grafana-patch.yaml
    target:
      kind: Deployment
      name: web
# Grafana 설정은 Docker 구성과 같은 파일을 그대로 쓴다.
configMapGenerator:
  - name: kervion-grafana-datasources
    files:
      - audit-mariadb.yml=../../../docker/grafana/provisioning/datasources/audit-mariadb.yml
  - name: kervion-grafana-dashboard-providers
    files:
      - audit.yml=../../../docker/grafana/provisioning/dashboards/audit.yml
  - name: kervion-grafana-alerting
    files:
      - input-high-risk.yml=../../../docker/grafana/provisioning/alerting/input-high-risk.yml
      - output-policy-alerts.yml=../../../docker/grafana/provisioning/alerting/output-policy-alerts.yml
  - name: kervion-grafana-dashboards
    files:
      - security-audit.json=../../../docker/grafana/dashboards/security-audit.json
generatorOptions:
  labels:
    app.kubernetes.io/part-of: kervion
    app.kubernetes.io/tier: app

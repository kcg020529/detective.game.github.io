# 로컬 이미지와 HTTP 접속 설정만 공통 base에 덮어쓴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: kervion-backend
    newName: kervion-backend
    newTag: k8s
  - name: kervion-web
    newName: kervion-web
    newTag: k8s
patches:
  - path: configmap-patch.yaml
  - path: web-service-patch.yaml

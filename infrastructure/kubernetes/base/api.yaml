apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: kervion
    app.kubernetes.io/name: api
    app.kubernetes.io/tier: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kervion
        app.kubernetes.io/name: api
        app.kubernetes.io/tier: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: kervion-backend
          imagePullPolicy: IfNotPresent
          # 엔드포인트에서 빠질 시간을 줘 교체 중 502를 막는다(K04-b 실측 1,661건 중 6건 실패).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kervion-config
          env:
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: MARIADB_PASSWORD
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: DEEPSEEK_MODEL
                  optional: true
            - name: DEEPSEEK_PLANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: DEEPSEEK_PLANNER_API_KEY
                  optional: true
            - name: DEEPSEEK_PLANNER_MODEL
              valueFrom:
                secretKeyRef:
                  name: kervion-secrets
                  key: DEEPSEEK_PLANNER_MODEL
                  optional: true
          volumeMounts:
            - name: fastembed-cache
              mountPath: /home/app/.cache/fastembed
          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 90
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: fastembed-cache
          persistentVolumeClaim:
            claimName: fastembed-cache
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: kervion
    app.kubernetes.io/name: api
    app.kubernetes.io/tier: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

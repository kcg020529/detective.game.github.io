# 환경 값은 overlay에서 지정하고 Job은 이름으로 골라 순서대로 실행한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kervion
resources:
  - namespace.yaml
  - configmap.yaml
  - mariadb.yaml
  - qdrant.yaml
  - fastembed-cache-pvc.yaml
  - api.yaml
  - web.yaml
  - jobs/migrate.yaml
  - jobs/load-data.yaml
  - jobs/rag-index.yaml
configMapGenerator:
  - name: kervion-nginx
    files:
      - nginx.conf=../../docker/nginx.conf
    # 이름에 내용 해시를 붙여 nginx.conf가 바뀌면 web이 새로 뜬다(subPath 마운트는 자동 갱신되지 않음).
    options:
      labels:
        app.kubernetes.io/part-of: kervion
        app.kubernetes.io/name: nginx
        app.kubernetes.io/tier: app

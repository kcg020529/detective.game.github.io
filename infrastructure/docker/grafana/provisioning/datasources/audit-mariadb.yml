apiVersion: 1

datasources:
  - name: Kervion Audit MariaDB
    uid: kervion-audit-mariadb
    type: mysql
    access: proxy
    url: mariadb:3306
    user: ${GRAFANA_DB_USER}
    isDefault: false
    editable: false
    jsonData:
      database: ${GRAFANA_DB_NAME}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD

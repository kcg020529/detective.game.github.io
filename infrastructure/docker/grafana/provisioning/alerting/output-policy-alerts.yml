apiVersion: 1

contactPoints:
  - orgId: 1
    name: Kervion Discord Output Guard
    receivers:
      - uid: kervion_discord_output
        type: discord
        disableResolveMessage: true
        settings:
          url: ${KERVION_DISCORD_WEBHOOK_URL}
          title: '{{ if eq .CommonLabels.alertname "DatasourceError" }}⚠️ OUTPUT · 감사 조회 오류{{ else if eq .CommonLabels.outcome "stopped" }}🔴 OUTPUT · 응답 중단{{ else if eq .CommonLabels.outcome "blocked" }}🔴 OUTPUT · 답변 차단{{ else if eq .CommonLabels.outcome "masked" }}🟠 OUTPUT · 마스킹{{ else if eq .CommonLabels.outcome "shadow" }}🟠 OUTPUT · 관찰 모드{{ else }}🟠 OUTPUT · 검사 알림{{ end }}'
          message: |-
            ⠀
            {{ if eq .CommonLabels.alertname "DatasourceError" }}상태: 출력 감사 데이터 조회 실패
            {{ else }}{{ range .Alerts.Firing }}판정: {{ .Labels.decision }} ({{ .Labels.guard_mode }})
            처리: {{ if eq .Labels.outcome "stopped" }}응답 중단{{ else if eq .Labels.outcome "blocked" }}제한 답변으로 대체{{ else if eq .Labels.outcome "masked" }}마스킹 후 전송{{ else if eq .Labels.outcome "shadow" }}관찰 후 답변 진행{{ else }}검사 기록{{ end }} · 적용={{ .Labels.applied }}
            신호: {{ .Labels.guard_signal }}
            요청: {{ .Labels.request_id }}
            {{- end }}{{ end }}

  - orgId: 1
    name: Kervion Discord Policy Denial
    receivers:
      - uid: kervion_discord_policy
        type: discord
        disableResolveMessage: true
        settings:
          url: ${KERVION_DISCORD_WEBHOOK_URL}
          title: '{{ if eq .CommonLabels.alertname "DatasourceError" }}⚠️ POLICY · 감사 조회 오류{{ else }}🟠 POLICY · 기록 접근 거부{{ end }}'
          message: |-
            ⠀
            {{ if eq .CommonLabels.alertname "DatasourceError" }}상태: 정책 감사 데이터 조회 실패
            {{ else }}{{ range .Alerts.Firing }}판정: deny ({{ .Labels.denial_stage }})
            처리: 권한 밖 기록 제외 후 진행
            신호: {{ .Labels.denial_reason }}
            요청: {{ .Labels.request_id }}
            {{- end }}{{ end }}

groups:
  - orgId: 1
    name: Kervion Output Guard Alerts
    folder: Kervion Security
    interval: 10s
    rules:
      - uid: kervion_output_guard_alert
        title: Output Guard alert detected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: kervion-audit-mariadb
            relativeTimeRange: {from: 60, to: 0}
            model:
              datasource: {type: mysql, uid: kervion-audit-mariadb}
              editorMode: code
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: >-
                SELECT NOW() AS time, 1 AS value,
                CAST(event_id AS CHAR) AS event_id_label, request_id,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.signals[0]')),
                'unknown') AS guard_signal,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.decision')),
                'unknown') AS decision,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')),
                'unknown') AS applied,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.mode')),
                'unknown') AS guard_mode,
                CASE
                  WHEN JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')) = 'block'
                    AND (JSON_CONTAINS(JSON_EXTRACT(signals_json, '$.signals'),
                    JSON_QUOTE('broken')) = 1
                    OR COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json,
                    '$.signals[0]')), 'unknown') NOT IN
                    ('canary', 'api_key', 'pii', 'context_leak', 'prompt_leak'))
                    THEN 'stopped'
                  WHEN JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')) = 'block'
                    THEN 'blocked'
                  WHEN JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')) = 'mask'
                    THEN 'masked'
                  WHEN JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.decision')) = 'block'
                    AND JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')) = 'allow'
                    THEN 'shadow'
                  ELSE 'other'
                END AS outcome
                FROM audit_events WHERE event_type = 'output_guard_alert'
                AND (level = 'alert' OR
                JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.applied')) IN ('mask', 'block'))
                AND occurred_at >= NOW() - INTERVAL 1 MINUTE
                ORDER BY time
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        labels: {component: output_guard, severity: warning}
        notification_settings:
          receiver: Kervion Discord Output Guard
          group_by: ['event_id_label']
          group_wait: 0s
          group_interval: 10s
          repeat_interval: 30m

  - orgId: 1
    name: Kervion Policy Denial Alerts
    folder: Kervion Security
    interval: 10s
    rules:
      - uid: kervion_policy_denial_alert
        title: Policy denial detected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: kervion-audit-mariadb
            relativeTimeRange: {from: 60, to: 0}
            model:
              datasource: {type: mysql, uid: kervion-audit-mariadb}
              editorMode: code
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: >-
                SELECT NOW() AS time, 1 AS value,
                CAST(event_id AS CHAR) AS event_id_label, request_id,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(
                JSON_KEYS(signals_json, '$.reasons'), '$[0]')),
                'unknown') AS denial_reason,
                COALESCE(JSON_UNQUOTE(JSON_EXTRACT(signals_json, '$.stage')),
                'unknown') AS denial_stage
                FROM audit_events WHERE event_type = 'policy_denial'
                AND occurred_at >= NOW() - INTERVAL 1 MINUTE
                ORDER BY time
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        labels: {component: policy_denial, severity: warning}
        notification_settings:
          receiver: Kervion Discord Policy Denial
          group_by: ['event_id_label']
          group_wait: 0s
          group_interval: 10s
          repeat_interval: 30m

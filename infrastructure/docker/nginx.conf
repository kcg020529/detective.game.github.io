events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_forwarded_proto $kervion_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # GET 요청은 빈 키로 제한에서 제외한다.
    map $request_method $kervion_post_ip {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $kervion_post_ip zone=kervion_auth:10m rate=10r/m;
    limit_req_zone $kervion_post_ip zone=kervion_chat:10m rate=20r/m;
    limit_conn_zone $kervion_post_ip zone=kervion_chat_connections:10m;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $kervion_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도하세요."}}';
        }

        location ~ ^/api/v1/auth/(signup|login)$ {
            limit_req zone=kervion_auth burst=5 nodelay;
            proxy_pass http://api:8000;
        }

        location ~ ^/api/v1/saves/[0-9]+/chats/[^/]+$ {
            limit_req zone=kervion_chat burst=10 nodelay;
            limit_conn kervion_chat_connections 2;
            proxy_pass http://api:8000;
        }

        location = /config.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 200 "window.KERVION_API_BASE = '/api/v1';";
        }

        location /api/ {
            proxy_pass http://api:8000;
        }

        location ~* \.(html|js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

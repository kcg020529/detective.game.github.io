name: Test and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      KERVION_OFFLINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/rag/requirements.txt
            database/loaders/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/rag/requirements.txt -r database/loaders/requirements.txt
      - name: Offline tests
        run: python -m pytest tests -q -p no:cacheprovider

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images without publishing
        shell: bash
        run: |
          tag="${GITHUB_SHA::7}"
          docker build -t "kervion-backend:$tag" -f infrastructure/docker/Dockerfile.backend .
          docker build -t "kervion-web:$tag" -f infrastructure/kubernetes/Dockerfile.web .
      - name: Render both overlays without a cluster
        shell: bash
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
            chmod +x "$RUNNER_TEMP/kubectl"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          cat > "$RUNNER_TEMP/aws.env" <<'EOF'
          AWS_REGION=ap-northeast-2
          CLUSTER_NAME=kervion
          ECR_REGISTRY=registry.example.invalid
          DOMAIN=ci.example.invalid
          CERT_ARN=arn:aws:acm:ap-northeast-2:000000000000:certificate/demo
          EOF
          bash infrastructure/kubernetes/scripts/render.sh local > "$RUNNER_TEMP/local.yaml"
          bash infrastructure/kubernetes/scripts/render.sh aws "${GITHUB_SHA::7}" "$RUNNER_TEMP/aws.env" > "$RUNNER_TEMP/aws.yaml"
          # client dry-run도 API discovery가 필요하므로 무클러스터 CI에서는 렌더링만 한다.
